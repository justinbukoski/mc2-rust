[package]
name = "mc2-render"
version = "0.1.0"
edition = "2021"
description = "Render front end: terrain, objects, camera and lighting (a port of MechCommander 2)"
license-file = "../LICENSE-MS-SSLPL.txt"
publish = false

[lib]
name = "mc2_render"

[dependencies]
mc2-gfx = { path = "../mc2-gfx" }
mc2-formats = { path = "../mc2-formats" }
mc2-assets = { path = "../mc2-assets" }
wgpu = "=30.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
png = "=0.18.1"
flate2 = "=1.1.10"
log = "0.4"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }

[dev-dependencies]
# Tests and examples take the gesture animation table from its owner (`mc2_sim::appearance::tables`).
mc2-sim = { path = "../mc2-sim" }
