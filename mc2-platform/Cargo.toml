[package]
name = "mc2-platform"
version = "0.1.0"
edition = "2021"
description = "Platform layer: winit window/input, audio mixer, MPEG-1 movies, fixed-step clock, user paths"
license-file = "../LICENSE-MS-SSLPL.txt"
publish = false

[lib]
name = "mc2_platform"

[features]
default = ["audio-device"]
# Real-time audio output through cpal. Without it the mixer still works (headless / tests).
audio-device = ["dep:cpal"]
[dependencies]
winit = "=0.30.13"
dirs = "=6.0.0"
log = "0.4"
cpal = { version = "=0.17.3", optional = true }
mc2-movie = { path = "../mc2-movie" }
mc2-formats = { path = "../mc2-formats" }

[dev-dependencies]
png = "=0.18.1"
