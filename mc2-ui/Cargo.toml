[package]
name = "mc2-ui"
version = "0.1.0"
edition = "2021"
description = "GUI framework: screen layouts, widgets, fonts, string table, 2D wgpu pipeline, menus (a port of MechCommander 2)"
license-file = "../LICENSE-MS-SSLPL.txt"
publish = false

[lib]
name = "mc2_ui"

[dependencies]
mc2-formats = { path = "../mc2-formats" }
mc2-assets = { path = "../mc2-assets" }
mc2-platform = { path = "../mc2-platform", default-features = false }
mc2-render = { path = "../mc2-render" }
mc2-campaign = { path = "../mc2-campaign" }
mc2-abl = { path = "../mc2-abl" }
mc2-sim-data = { path = "../mc2-sim-data" }
mc2-gfx = { path = "../mc2-gfx" }
wgpu = "=30.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
log = "0.4"
object = { version = "=0.39.1", default-features = false, features = ["read_core", "elf", "pe", "std", "unaligned"] }

[dev-dependencies]
png = "=0.18.1"
pollster = "=1.0.1"
